<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Manager Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header><div class="hrow"><b>Bus Manager Simulator</b><span class="sp"></span><span class="money" id="money"></span></div><div id="ctl"><span id="co" class="mut"></span><span id="usr"></span><span id="date" style="font-weight:600"></span><span id="clock"></span><button class="btn alt" id="spd" style="color:#f3ecd6" onclick="cycSpd()">1x</button><button class="btn alt" id="th" style="color:#f3ecd6" onclick="setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')"></button><button class="btn alt" style="color:#f3ecd6" onclick="zoom(-1)" aria-label="Perkecil peta">Zoom -</button><button class="btn alt" style="color:#f3ecd6" onclick="zoom(1)" aria-label="Perbesar peta">Zoom +</button><button class="btn alt" id="snd" style="color:#f3ecd6" onclick="toggleSnd()">🎵 Musik</button><button class="btn alt" id="nt" style="color:#f3ecd6" onclick="toggleNotif()">🔔 Notif</button><button class="btn alt" id="gbtn" style="color:#f3ecd6" onclick="gOpen()">🅿️ Garasi</button><button class="btn alt" id="pz" style="color:#f3ecd6" onclick="S.paused=!S.paused;$('#pz').textContent=S.paused?'Lanjut':'Jeda'">Jeda</button></div></header>
<main>
<div id="mapcol"><div id="sbar"><input type="text" id="q" placeholder="Cari kota atau provinsi" aria-label="Cari kota" autocomplete="off" oninput="doSearch()" onfocus="doSearch()" onkeydown="if(event.key==='Enter')pickFirst()"><div id="sres"></div></div><div id="mapbox"><div id="mapwrap"><svg id="map" viewBox="0 0 1000 430" role="img" aria-label="Peta Indonesia">
<rect width="1000" height="430" style="fill:var(--sea)"/><g id="grid"></g><g id="halo"></g><g id="land"></g><g id="veg"></g><g id="isl" font-family="Barlow Condensed" font-size="13" style="fill:var(--islt)" font-style="italic"></g><g id="cities"></g><g id="dyn"></g><g id="deco" pointer-events="none" font-family="Barlow Condensed" font-size="12" style="fill:var(--maptxt)"><g font-style="italic" opacity=".6" text-anchor="middle"><text x="60" y="300">Samudra Hindia</text><text x="135" y="62">Selat Malaka</text><text x="293" y="47">Laut Cina Selatan</text><text x="358" y="284">Laut Jawa</text><text x="716" y="301">Laut Banda</text><text x="553" y="341">Laut Flores</text><text x="803" y="86">Samudra Pasifik</text><text x="868" y="350">Laut Arafura</text><text x="694" y="416">Laut Timor</text><text x="596" y="91">Laut Sulawesi</text><text x="668" y="179">Laut Maluku</text></g><g transform="translate(52,372)"><path d="M0,-22L5,0L0,22L-5,0Z" opacity=".4"/><path d="M0,-22L5,0L-5,0Z"/><path d="M-22,0L0,-4L22,0L0,4Z" opacity=".25"/><text y="-26" text-anchor="middle">U</text></g><g transform="translate(112,408)"><rect width="98" height="3"/><rect width="2" height="9" y="-6"/><rect x="96" width="2" height="9" y="-6"/><text y="-9" font-size="10">0 – 500 km</text></g></g><text id="tip" style="fill:var(--tip);stroke:var(--sea)" font-size="11" font-family="Barlow" paint-order="stroke" stroke-width="3"></text></svg></div><button id="fsb" onclick="fsToggle()" aria-label="Layar penuh" title="Layar penuh">⛶</button></div></div>
<div id="panel"></div></main>
<nav id="nav"></nav><div id="fsbar"><button onclick="zoom(-1)" aria-label="Perkecil peta">−</button><button onclick="zoom(1)" aria-label="Perbesar peta">+</button><button id="fspz" onclick="S.paused=!S.paused;$('#pz').textContent=S.paused?'Lanjut':'Jeda';fsSync()" aria-label="Jeda">⏸</button><button id="fssp" onclick="cycSpd();fsSync()" aria-label="Kecepatan">1x</button><button onclick="fsToggle()" aria-label="Keluar layar penuh">✕</button></div><div id="toast"></div><div id="gar" onclick="if(event.target===this)gClose()"><div class="box" id="gbox"></div></div><div id="modal"><div class="box" id="mbox"></div></div>
<div id="login"><div class="lbox"><h2>Bus Manager Simulator</h2><div class="ltabs"><button class="btn" id="lt0" onclick="lMode(0)">Masuk</button><button class="btn alt" id="lt1" onclick="lMode(1)">Buat akun</button></div><p class="mut" id="lhint" style="margin:0 0 8px;font-size:13px">Masuk dengan nama HRD dan kata sandimu.</p><input id="lu" type="text" maxlength="20" placeholder="Nama HRD" autocomplete="username" aria-label="Nama HRD"><input id="lp" type="password" maxlength="40" placeholder="Kata sandi" autocomplete="current-password" aria-label="Kata sandi"><input id="lp2" type="password" maxlength="40" placeholder="Ulangi kata sandi" autocomplete="new-password" aria-label="Ulangi kata sandi" style="display:none"><div id="lerr" class="bad" role="alert"></div><button class="btn" id="lgo" style="width:100%" onclick="lSubmit()">Masuk</button></div></div>
<div id="splash" onclick="endSplash()"><img id="spImg" alt="Bus Manager Simulator"><div id="spt">KETUK UNTUK LANJUT</div><div id="spbar"><i></i></div></div>
<script src="script.js"></script></body></html>
